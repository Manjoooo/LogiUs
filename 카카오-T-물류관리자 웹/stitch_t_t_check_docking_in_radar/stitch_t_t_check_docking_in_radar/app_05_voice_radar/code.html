<!DOCTYPE html><html lang="ko"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>APP-05 운송 진행</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style data-purpose="custom-styles">
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      background-color: #f3f4f6;
    }
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-900 pb-20">
<!-- BEGIN: Header -->
<header class="bg-white px-4 py-3 flex items-center justify-between border-b border-gray-200 sticky top-0 z-10" data-purpose="app-header">
<button aria-label="뒤로가기" class="text-gray-600 p-2 -ml-2">
<i class="fa-solid fa-chevron-left text-lg"></i>
</button>
<h1 class="text-lg font-bold">운송 진행</h1>
<button aria-label="메뉴" class="text-gray-600 p-2 -mr-2">
<i class="fa-solid fa-bars text-lg"></i>
</button>
</header>
<!-- END: Header -->
<main class="p-4 space-y-4">
<!-- BEGIN: Cargo Info Card -->
<section class="bg-white rounded-xl shadow-sm p-5" data-purpose="cargo-info">
<div class="flex items-center justify-between mb-2">
<span class="text-emerald-600 font-bold text-sm bg-emerald-50 px-2 py-1 rounded-md">[Emerald truck] 신뢰 화물</span>
<span class="text-xs text-gray-500 font-medium border border-gray-200 px-2 py-1 rounded-full">정상 운행중</span>
</div>
<h2 class="text-2xl font-black text-gray-800 tracking-tight">KA-1025</h2>
<p class="text-sm text-gray-500 mt-1">서울 물류센터 <i class="fa-solid fa-arrow-right mx-1 text-xs"></i> 부산 터미널</p>
</section>
<!-- END: Cargo Info Card -->
<!-- BEGIN: Progress Section -->
<section class="bg-white rounded-xl shadow-sm p-5" data-purpose="progress-status">
<div class="flex justify-between items-end mb-4">
<div>
<p class="text-xs text-gray-500 mb-1">지오펜스 상태</p>
<h3 class="text-lg font-bold text-blue-600">물류센터 진입 대기</h3>
</div>
<div class="text-right">
<p class="text-xs text-gray-500 mb-1">진행 단계</p>
<p class="text-sm font-bold text-gray-700">3 / 10</p>
</div>
</div>
<!-- 10 Step Progress Bar -->
<div class="relative w-full h-2 bg-gray-100 rounded-full overflow-hidden flex" data-purpose="progress-bar">
<!-- Completed steps -->
<div class="h-full bg-blue-500 border-r border-white w-1/10"></div>
<div class="h-full bg-blue-500 border-r border-white w-1/10"></div>
<div class="h-full bg-blue-500 border-r border-white w-1/10"></div>
<!-- Remaining steps -->
<div class="h-full bg-gray-200 border-r border-white w-1/10"></div>
<div class="h-full bg-gray-200 border-r border-white w-1/10"></div>
<div class="h-full bg-gray-200 border-r border-white w-1/10"></div>
<div class="h-full bg-gray-200 border-r border-white w-1/10"></div>
<div class="h-full bg-gray-200 border-r border-white w-1/10"></div>
<div class="h-full bg-gray-200 border-r border-white w-1/10"></div>
<div class="h-full bg-gray-200 w-1/10"></div>
</div>
<div class="flex justify-between text-[10px] text-gray-400 mt-2 px-1">
<span>출발</span>
<span>상차</span>
<span>이동</span>
<span>도착</span>
</div>
</section>
<!-- END: Progress Section -->
<!-- BEGIN: Quick Buttons -->
<section data-purpose="quick-actions">
<div class="grid grid-cols-4 gap-2">
<button class="bg-white py-3 px-2 rounded-xl shadow-sm flex flex-col items-center justify-center gap-2 active:bg-gray-50 transition-colors">
<div class="w-10 h-10 rounded-full bg-blue-50 flex items-center justify-center text-blue-500">
<i class="fa-solid fa-truck-ramp-box text-lg"></i>
</div>
<span class="text-xs font-medium text-gray-700">상차 완료</span>
</button>
<button class="bg-white py-3 px-2 rounded-xl shadow-sm flex flex-col items-center justify-center gap-2 active:bg-gray-50 transition-colors">
<div class="w-10 h-10 rounded-full bg-indigo-50 flex items-center justify-center text-indigo-500">
<i class="fa-solid fa-location-dot text-lg"></i>
</div>
<span class="text-xs font-medium text-gray-700">도착 알림</span>
</button>
<button class="bg-white py-3 px-2 rounded-xl shadow-sm flex flex-col items-center justify-center gap-2 active:bg-gray-50 transition-colors">
<div class="w-10 h-10 rounded-full bg-orange-50 flex items-center justify-center text-orange-500">
<i class="fa-solid fa-triangle-exclamation text-lg"></i>
</div>
<span class="text-xs font-medium text-gray-700">도로 장애</span>
</button>
<button class="bg-white py-3 px-2 rounded-xl shadow-sm flex flex-col items-center justify-center gap-2 active:bg-gray-50 transition-colors">
<div class="w-10 h-10 rounded-full bg-gray-50 flex items-center justify-center text-gray-600">
<i class="fa-solid fa-ellipsis text-lg"></i>
</div>
<span class="text-xs font-medium text-gray-700">더보기</span>
</button>
</div>
</section>
<!-- END: Quick Buttons -->
<!-- BEGIN: Voice Reporting Card -->
<section data-purpose="voice-report">
<button class="w-full bg-gradient-to-r from-blue-50 to-indigo-50 border border-blue-100 rounded-xl p-5 flex items-center gap-4 text-left shadow-sm active:from-blue-100 active:to-indigo-100 transition-colors">
<div class="w-14 h-14 shrink-0 bg-white rounded-full shadow-sm flex items-center justify-center text-blue-600 text-2xl border border-blue-50">
          🎙
        </div>
<div>
<h3 class="text-lg font-bold text-gray-900 mb-0.5">말로 현장 알려주기</h3>
<p class="text-sm text-gray-600">운전 중 타이핑 없이 간편하게 제보하세요</p>
</div>
<div class="ml-auto text-blue-300">
<i class="fa-solid fa-chevron-right"></i>
</div>
</button>
</section>
<!-- END: Voice Reporting Card -->
<!-- BEGIN: Problem Reporting Section -->
<section class="bg-white rounded-xl shadow-sm p-5 flex items-center justify-between" data-purpose="manual-report">
<div>
<h3 class="text-base font-bold text-gray-800">현장에 문제가 있나요?</h3>
<p class="text-xs text-gray-500 mt-1">텍스트나 사진으로 자세히 제보하기</p>
</div>
<button class="bg-gray-900 text-white px-4 py-2 rounded-lg text-sm font-medium active:bg-gray-800 transition-colors">
        제보하기
      </button>
</section>
<!-- END: Problem Reporting Section -->
</main>
<style data-purpose="tailwind-custom-utilities">
    /* For custom tailwind configuration if needed */
    .w-1\/10 { width: 10%; }
  </style>
</body></html>
