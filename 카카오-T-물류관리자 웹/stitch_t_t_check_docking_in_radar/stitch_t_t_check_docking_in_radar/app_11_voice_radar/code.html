<body class="bg-background text-on-background min-h-screen pb-[80px]">
<!-- TopAppBar (Transactional - simplified) -->
<header class="bg-surface border-b border-outline-variant h-[64px] flex items-center px-margin-mobile sticky top-0 z-50">
<button class="mr-4 text-on-surface flex items-center justify-center min-h-touch-target-min min-w-[52px]">

</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-on-surface flex-1">음성 제보 확인</h1>
<button class="text-on-surface flex items-center justify-center min-h-touch-target-min min-w-[52px]">
<span class="material-symbols-outlined">close</span>
</button>
</header>
<main class="p-margin-mobile max-w-2xl mx-auto space-y-6">
<!-- Vehicle Context Tag -->
<div class="inline-flex items-center bg-surface-container-high px-4 py-2 rounded-full border border-outline-variant space-x-2">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">local_shipping</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">KA-1025 [Emerald truck]</span>
</div>
<section class="space-y-4">
<h2 class="font-title-md text-title-md text-on-surface flex items-center gap-2">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">check_circle</span>
                이렇게 이해했어요
            </h2>
<!-- Original Voice Text Card -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-4 shadow-sm relative overflow-hidden">
<div class="absolute -top-4 -right-4 w-16 h-16 bg-primary-container rounded-full opacity-20"></div>
<div class="flex items-start gap-3">
<span class="material-symbols-outlined text-secondary mt-1">record_voice_over</span>
<p class="font-body-lg text-body-lg text-on-surface leading-relaxed relative z-10">
                        "앞에 산에서 돌이 떨어져서 2개 차로가 막혀 있어요."
                    </p>
</div>
</div>
<!-- AI Structured Data Bento Box -->
<div class="grid grid-cols-2 gap-4">
<div class="bg-error-container/20 border border-error-container rounded-xl p-4 flex flex-col gap-1">
<span class="font-label-sm text-label-sm text-error flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">warning</span> 유형
                    </span>
<span class="font-title-md text-title-md text-on-surface">도로 장애 / 낙석</span>
</div>
<div class="bg-surface-container border border-outline-variant rounded-xl p-4 flex flex-col gap-1">
<span class="font-label-sm text-label-sm text-secondary flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">traffic</span> 영향
                    </span>
<span class="font-title-md text-title-md text-on-surface">2개 차로 통제</span>
</div>
<div class="col-span-2 bg-surface-container border border-outline-variant rounded-xl p-4 flex flex-col gap-1">
<span class="font-label-sm text-label-sm text-secondary flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">location_on</span> 위치 &amp; 시간
                    </span>
<div class="flex justify-between items-end mt-1">
<span class="font-title-md text-title-md text-on-surface">현재 위치 기반</span>
<span class="font-body-md text-body-md text-secondary">14:04</span>
</div>
</div>

<span class="material-symbols-outlined text-[16px]">zoom_out_map</span> 지도 크게 보기

</div>

<button class="flex-1 min-h-touch-target-min bg-surface-container-lowest border border-outline-variant text-on-surface font-title-md text-title-md rounded-lg flex items-center justify-center gap-2 hover:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined">edit</span>

<button class="flex-1 min-h-touch-target-min bg-surface-container-lowest border border-outline-variant text-on-surface font-title-md text-title-md rounded-lg flex items-center justify-center gap-2 hover:bg-surface-container-low transition-colors"><span class="material-symbols-outlined">mic_external_on</span><div class="flex flex-col items-center leading-tight"><span class="text-label-sm">다시</span><span class="text-label-sm">입력</span></div></button>

<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">send</span>제보
                </button>
</div>
